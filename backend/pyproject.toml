[project]
name = "backend"
version = "0.1.0"
description = "Metrion FastAPI application — agents, orchestration, auth, API surface. See CLAUDE.md's stack decision."
requires-python = ">=3.12"
dependencies = [
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.1",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "clerk-backend-api>=1.5",
    "svix>=1.45",
    "httpx>=0.27",
    "python-multipart>=0.0.12",
    "PyPDF2>=3.0",  # services/ceo_attachments.py reads uploaded PDFs (spec Q35)
    "openpyxl>=3.1",  # services/ceo_attachments.py reads uploaded .xlsx files
    # NOTE: `competitor-intelligence` (packages/competitor-intelligence), `cfo`
    # (packages/cfo) and `product-intelligence` (packages/product-intelligence) are all real
    # runtime dependencies — backend/api/v1/ci.py, cfo.py, pi.py, agents/ceo_hub.py, and
    # services/pi_actions.py / backend/entitlement.py all import one or more of them directly
    # — but none is listed here. A relative `file:` reference was
    # tried and reverted: pip resolves a relative `file:` dependency specifier against the
    # CURRENT WORKING DIRECTORY at install time, not against this pyproject.toml's own
    # directory, so `pip install -e backend` succeeds or fails depending on which directory
    # the installer happens to run from — confirmed directly (`pip install -e backend` from
    # the repo root resolved the relative path one level too high and failed). That is worse
    # than no declaration at all: it would look declared while silently breaking for anyone
    # who installs from a different cwd. See `README.md`'s "Running locally" section for the
    # real, explicit install order this monorepo actually needs (no workspace-aware build
    # tool — e.g. uv/hatch workspaces — is in use yet to do this properly).
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "mypy>=1.10", "pytest-asyncio>=0.24"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
files = ["src"]
