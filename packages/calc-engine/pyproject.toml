[project]
name = "calc-engine"
version = "0.1.0"
description = "Metrion deterministic engine (Brain 1) — see docs/specs/deterministic-engine.md"
requires-python = ">=3.12"
dependencies = [
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.1",
    # HttpxGstFetcher (gst_lookup/fetcher.py, §8.4.1) — the only real network dependency in
    # this package, imported lazily inside the one function that uses it (mirroring
    # competitor-intelligence's own fetcher.py), same as httpx there.
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "hypothesis>=6.100", "mypy>=1.10"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
calc_engine = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
files = ["src"]
