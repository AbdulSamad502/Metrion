[project]
name = "data-foundation"
version = "0.1.0"
description = "Metrion file-understanding / ingestion layer — see docs/specs/data-foundation.md"
requires-python = ">=3.12"
dependencies = [
    # calc-engine is a workspace-local dependency (Confidence/Paise types, shared
    # monotonicity rule — not redefined here). Install both in the same environment:
    #   pip install -e ../calc-engine -e .
    "calc-engine",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "mypy>=1.10"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
files = ["src"]
