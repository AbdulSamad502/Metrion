[project]
name = "product-intelligence"
version = "0.1.0"
description = "Metrion Product Intelligence agent (PI) — see docs/specs/product-intelligence-agent.md"
requires-python = ">=3.12"
dependencies = [
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.1",
    "httpx>=0.27",
    "pgvector>=0.3",
    # NOTE: `calc-engine` (packages/calc-engine) is a real runtime dependency — PI's
    # `discovery/feasibility.py` calls `calc_engine.api.estimate_product_feasibility` directly
    # (PI build plan §1/§6.7) — but it is deliberately NOT listed here, for the same reason
    # `packages/cfo/pyproject.toml` documents for its own identical calc-engine dependency: a
    # relative `file:` specifier resolves against the *installer's* cwd, not this file's
    # directory, and this monorepo has no workspace-aware build tool yet. Install calc-engine
    # before product-intelligence, same order as CFO's own install instructions.
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "hypothesis>=6.100", "mypy>=1.10"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
product_intelligence = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
files = ["src"]
