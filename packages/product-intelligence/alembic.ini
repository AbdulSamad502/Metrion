[alembic]
script_location = migrations
prepend_sys_path = .
path_separator = os
version_path_separator = os

# sqlalchemy.url is deliberately absent here — env.py reads DATABASE_URL from the
# environment (see .env.example at the repo root) so no connection string, credential,
# or environment-specific value is ever committed to this file.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
