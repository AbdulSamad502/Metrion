[project]
name = "competitor-intelligence"
version = "0.1.0"
description = "Metrion Competitor Intelligence agent (CI) — see docs/specs/competitor-intelligence-agent.md"
requires-python = ">=3.12"
dependencies = [
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.1",
    "httpx>=0.27",
    "pillow>=10.0",  # intake/quality.py: image decode, sharpness, perceptual hash (C36)
    # NOTE: `data-foundation` (packages/data-foundation) is a real runtime dependency —
    # `seller_product/derive.py` imports `data_foundation.repositories.tenant_context`
    # directly to read `sales_line` (competitor-intelligence-agent.md §5.5.1) — but it is
    # deliberately NOT listed here, for the same reason backend/pyproject.toml documents for
    # not listing `competitor-intelligence`: a relative `file:` specifier resolves against
    # the *installer's* cwd, not this file's directory, and this monorepo has no
    # workspace-aware build tool yet. See `.github/workflows/ci.yml` (installs data-foundation
    # before competitor-intelligence) and `backend/README.md`'s install order.
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "hypothesis>=6.100", "mypy>=1.10"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
competitor_intelligence = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
files = ["src"]
