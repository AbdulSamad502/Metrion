name: CI

# Runs pytest, the no-float lint, and a migration round-trip for both
# packages/calc-engine and packages/data-foundation, against a real Postgres —
# the same standard already applied manually throughout this project (Category
# B/C checkpoints), now automated.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: metrion
          POSTGRES_PASSWORD: metrion_dev_password
          POSTGRES_DB: metrion
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U metrion"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # Service containers start before checkout, so docker/postgres-init/*.sql
      # can't run as Postgres init scripts here — applied explicitly below instead.
      DATABASE_URL: postgresql+psycopg://metrion_migrate:metrion_migrate_dev_password@localhost:5432/metrion
      DATABASE_URL_APP: postgresql+psycopg://metrion_app:metrion_app_dev_password@localhost:5432/metrion
      PGPASSWORD: metrion_dev_password

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Wait for Postgres
        run: |
          for i in $(seq 1 30); do
            pg_isready -h localhost -U metrion && break
            sleep 1
          done

      - name: Bootstrap extensions and roles (docker/postgres-init/*.sql)
        run: |
          psql -h localhost -U metrion -d metrion -f docker/postgres-init/01-enable-pgvector.sql
          psql -h localhost -U metrion -d metrion -f docker/postgres-init/02-roles.sql

      - name: Install calc-engine
        run: pip install -e "packages/calc-engine[dev]"

      - name: Install data-foundation
        run: pip install -e "packages/data-foundation[dev]"

      - name: Install competitor-intelligence
        run: pip install -e "packages/competitor-intelligence[dev]"

      - name: Install cfo
        run: pip install -e "packages/cfo[dev]"

      # market-signals MUST be installed before product-intelligence and slim-cmo (shared source layer;
      # a path dependency cannot be declared in this monorepo - see packages/product-intelligence/pyproject.toml).
      - name: Install market-signals
        run: pip install -e "packages/market-signals[dev]"

      - name: Install product-intelligence
        run: pip install -e "packages/product-intelligence[dev]"

      - name: Install slim-cmo
        run: pip install -e "packages/slim-cmo[dev]"

      - name: calc-engine — no-float lint
        run: python packages/calc-engine/scripts/lint_no_float.py

      - name: data-foundation — no-float lint
        run: python packages/data-foundation/scripts/lint_no_float.py

      - name: slim-cmo — no-float lint
        run: python packages/slim-cmo/scripts/lint_no_float.py

      - name: calc-engine — migrate (upgrade, downgrade, re-upgrade)
        working-directory: packages/calc-engine
        run: |
          python -m alembic upgrade head
          python -m alembic downgrade base
          python -m alembic upgrade head

      - name: data-foundation — migrate (upgrade, downgrade, re-upgrade)
        working-directory: packages/data-foundation
        run: |
          python -m alembic upgrade head
          python -m alembic downgrade base
          python -m alembic upgrade head

      - name: competitor-intelligence — migrate (upgrade, downgrade, re-upgrade)
        working-directory: packages/competitor-intelligence
        run: |
          python -m alembic upgrade head
          python -m alembic downgrade base
          python -m alembic upgrade head

      - name: cfo — migrate (upgrade, downgrade, re-upgrade)
        working-directory: packages/cfo
        run: |
          python -m alembic upgrade head
          python -m alembic downgrade base
          python -m alembic upgrade head

      - name: product-intelligence — migrate (upgrade, downgrade, re-upgrade)
        working-directory: packages/product-intelligence
        run: |
          python -m alembic upgrade head
          python -m alembic downgrade base
          python -m alembic upgrade head

      - name: slim-cmo — migrate (upgrade, downgrade, re-upgrade)
        working-directory: packages/slim-cmo
        run: |
          python -m alembic upgrade head
          python -m alembic downgrade base
          python -m alembic upgrade head

      - name: calc-engine — pytest (unit + integration)
        working-directory: packages/calc-engine
        run: python -m pytest tests/ -v

      - name: data-foundation — pytest (unit + integration)
        working-directory: packages/data-foundation
        run: python -m pytest tests/ -v

      - name: competitor-intelligence — pytest (unit + integration)
        working-directory: packages/competitor-intelligence
        run: python -m pytest tests/ -v

      - name: cfo — pytest (unit + integration)
        working-directory: packages/cfo
        run: python -m pytest tests/ -v

      - name: market-signals — pytest
        working-directory: packages/market-signals
        run: python -m pytest tests/ -v

      - name: product-intelligence — pytest (unit + integration)
        working-directory: packages/product-intelligence
        run: python -m pytest tests/ -v

      - name: slim-cmo — pytest (unit + integration)
        working-directory: packages/slim-cmo
        run: python -m pytest tests/ -v

      # backend depends on competitor-intelligence, cfo and product-intelligence at import time (api/v1/ci.py,
      # ceo_hub.py, agents/ceo_hub.py, and cfo's analogous routes/dispatch) but does not
      # declare either in pyproject.toml — see the comment there for why a relative `file:`
      # dependency doesn't work in this monorepo. competitor-intelligence and cfo are already
      # installed above; this only adds backend itself.
      - name: Install backend
        run: pip install -e "backend[dev]"

      - name: backend — migrate (upgrade, downgrade, re-upgrade)
        working-directory: backend
        run: |
          python -m alembic upgrade head
          python -m alembic downgrade base
          python -m alembic upgrade head

      - name: backend — pytest (unit + integration)
        working-directory: backend
        env:
          # No real Clerk project exists in CI — every backend test either stubs
          # get_clerk_client() directly or never exercises a live Clerk call at all
          # (resolve_auth_context() tests pass claims in directly). These three only need
          # to be non-empty strings so backend.main.create_app() doesn't fail at import
          # time (backend/config.py's _required() checks presence, not validity).
          CLERK_SECRET_KEY: sk_test_ci_placeholder
          CLERK_WEBHOOK_SECRET: whsec_ci_placeholder
          CLERK_JWT_KEY: "-----BEGIN PUBLIC KEY-----\nCIPLACEHOLDER\n-----END PUBLIC KEY-----"
          FRONTEND_ORIGIN: http://localhost:3000
        run: python -m pytest tests/ -v
